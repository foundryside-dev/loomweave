repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      # `scripts/` is linted but not yet format-gated: the two federation-seam
      # scripts added with the golden fixtures are 769 lines that no gate
      # covered, and one of them produces normative consumer bytes. Six
      # pre-existing check-*.py files need reformatting (~89 lines) before
      # ruff-format can extend here, which is left as its own mechanical change.
      - id: ruff
        args: [--fix]
        files: ^(plugins/python|scripts)/.*\.py$
      - id: ruff-format
        files: ^plugins/python/.*\.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        files: ^plugins/python/(src|tests)/.*\.py$
        # Run mypy against the whole plugin tree (not just staged files in
        # isolation) so intra-package imports resolve. The files: pattern
        # above triggers the hook; args: names the actual target.
        pass_filenames: false
        args: [--strict, --config-file=plugins/python/pyproject.toml, plugins/python]
        additional_dependencies:
          - pytest>=8.0
  - repo: local
    hooks:
      - id: wardline-scan
        name: wardline scan
        entry: wardline scan
        language: system
        types: [python]
        pass_filenames: false

