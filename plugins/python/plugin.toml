[plugin]
name = "loomweave-plugin-python"
plugin_id = "python"
version = "1.6.1"
protocol_version = "1.0"
# Bare basename per ADR-021 §Layer 1 + WP2 scrub commit eb0a41d — the host
# refuses manifests whose `executable` carries any path component.
executable = "loomweave-plugin-python"
language = "python"
extensions = ["py"]

[capabilities.runtime]
# Plugin's declared RSS envelope (MiB). For plugins declaring
# [capabilities.runtime.pyright] this documents resident memory only: the
# host applies its 8 GiB language-server RLIMIT_AS ceiling
# (LANGUAGE_SERVER_MAX_AS_MIB, ADR-021 §2d amendment) because pyright's
# Node/V8 process reserves virtual space far beyond its RSS.
expected_max_rss_mb = 2048
# Triggers LMWV-INFRA-PLUGIN-ENTITY-OVERRUN-WARNING well before the 500k
# core cap (warning emission itself is deferred to Tier B — Sprint 1
# only lands the declaration).
expected_entities_per_file = 5000
# Wardline semantic extraction reads the NG-25 vocabulary descriptor without
# importing Wardline, then emits source-observed decorator metadata on entities.
wardline_aware = true
# v0.1 rejects `true` at initialize with LMWV-INFRA-MANIFEST-UNSUPPORTED-CAPABILITY.
reads_outside_project_root = false

# Declaring this sub-table marks the plugin as a language-server host: it spawns
# pyright-langserver (Node). The host detects this and leaves RLIMIT_NPROC
# uncapped for the plugin — RLIMIT_NPROC is per-UID-global and would otherwise
# fail pyright's fork() with EAGAIN on a busy workstation (see ADR-021,
# "process-count control", and host::effective_max_nproc).
[capabilities.runtime.pyright]
pin = "1.1.409"

[ontology]
# Sprint 2 B.2: classes + modules join the kind set. B.3 (ADR-026) adds
# the first edge kind, `contains`. B.4* adds scan-time `calls` edges.
# B.5* adds scan-time `references` edges. Phase 3 Task 3 adds scan-time
# `imports` candidate edges. clarion-43416be550 adds scan-time
# `inherits_from` (subclass → base) + `decorates` (decorator → decorated)
# relation edges, resolved through the same pyright reference machinery.
entity_kinds = ["function", "class", "module"]
edge_kinds = ["contains", "calls", "references", "imports", "inherits_from", "decorates"]
# Per ADR-022: uppercase `LMWV-{PLUGIN_ID_UPPER}-`. Reserved at parse
# against the LMWV-INFRA-* and LMWV-FACT-* namespaces.
rule_id_prefix = "LMWV-PY-"
# Bumps per ADR-027 when the entity/edge/rule set shifts. Phase 3 Task 3 is a
# MINOR bump (additive `imports` edge kind); 0.8.0 is the additive
# `inherits_from` + `decorates` MINOR bump (clarion-43416be550); 0.9.0 is the
# additive `public-surface` reachability-root tag (clarion-4ec50f3d92) — a
# no-`__all__` library's public defs/classes are now tagged as roots; 0.10.0
# adds module-level `exported-api` for explicit `__all__` re-export/imported-name
# surfaces without double-counting local function/class exports, including
# literal `__all__ += [...]` extensions; 0.11.0 adds manual main-guard,
# runner-wrapper, `sys.argv`, and argparse `cli-command` tagging; 0.12.0
# declares the complete static classifier set so supported-empty results are
# distinguishable from unsupported classifiers and forces unchanged files to
# re-dispatch. Classifier declarations do not create entity-tag rows. 0.13.0
# widens `calls` targets to class entities: an instantiation ``Name(...)``
# is a call to the class (clarion-e5224c3aff) -- a semantic widening of an
# existing kind, bumped so unchanged files re-dispatch and pick up the edges.
# NOTE:
# ADR-007's summary-cache key is the 5-tuple (entity_id, content_hash,
# prompt_template_id, model_tier, guidance_fingerprint) — ontology_version is
# handshake-validation, NOT a cache-key component. New edge rows miss the
# cache by component-1 of the 5-tuple organically (no edges live in the
# 5-tuple yet anyway).
ontology_version = "0.13.0"
classifier_tags = [
    "cli-command",
    "data-model",
    "entry-point",
    "exported-api",
    "framework-handler",
    "http-route",
    "public-surface",
    "test",
]

[integrations.wardline]
expected_descriptor_version = "wardline-generic-2"
# The dual-accept set, as `schema@version` PAIRS. A version-only list would
# destroy the schema/version association the gate rests on (re-admitting
# "version alone unlocks v2 parsing"). A space-separated STRING, never a TOML
# array: manifest.rs:137 deserialises this table as BTreeMap<String, String>,
# so an array value is a hard manifest-parse failure.
accepted_descriptors = "wardline.vocabulary/v1@wardline-generic-2 wardline.vocabulary/v2@wardline-generic-3"

[ontology.roles]
file_scope = ["module"]
callable = ["function"]
syntax_degraded_module = ["module"]

# SEI signature declaration (ADR-038 REQ-C-01 / Wave 1). The plugin emits a
# versioned `signature` object per function/class entity, stored verbatim by the
# core and compared by string equality as the matcher's move-case input. Modules
# and packages declare no signature (the move case abstains for them — fail
# closed). A `schema_version` bump voids cached signature equality.
[signature]
schema_version = 1

[signature.schemas.function]
v = 1
fields = ["params", "return_ann"]

[signature.schemas.class]
v = 1
fields = ["bases"]
