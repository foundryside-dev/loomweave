name: Verify

# Single source of truth for the pre-merge / pre-release gate set (closes
# V11-CI-01, clarion-c9f62eec7d). Both ci.yml (every PR + push to main) and
# release.yml (the pre-publish gate) call this via `workflow_call`, so the
# CI floor in CLAUDE.md "Build, test, lint" is defined exactly once and the two
# entry points can no longer drift (the failure mode the old "Duplicated rather
# than refactored" note in release.yml warned about).
#
# Reusable-workflow notes:
#   * A called workflow does NOT inherit the caller's top-level `env`, so the
#     RUSTFLAGS / CARGO_TERM_COLOR block is defined here, not in the callers.
#   * No secrets are used by any gate job, so callers need no `secrets:` line.
#   * Release-only concerns (assert-tag-on-main, build/publish) stay in the
#     caller — this workflow is purely the gate.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so the ADR-024 migration-retirement guard can resolve
          # the published_build.txt ref via `git show <ref>:0001` (the marker
          # names a commit SHA, which a shallow checkout can't read).
          # clarion-12667da9f5 / clarion-0106a61480.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      # Python is used by the migration-retirement guard and lockstep guards
      # below. Pin >= 3.11 explicitly so the stdlib `tomllib` is available
      # regardless of which Python the runner image happens to preinstall.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # This deliberately follows Wardline's moving authority. Only the public
      # fixture bytes are fetched; no sibling code is checked out or executed.
      # Keeping the guard inside the required Rust context makes drift block PR
      # merges as well as release verification (clarion-72e1c1a07d).
      - name: Wardline taint golden lockstep
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/foundryside-dev/wardline/main/tests/conformance/fixtures/wardline-taint-fact-wire.golden.json \
            --output "$RUNNER_TEMP/wardline-taint-fact-wire.golden.json"
          python scripts/check-wardline-taint-golden.py --self-test
          python scripts/check-wardline-taint-golden.py \
            --authority-file "$RUNNER_TEMP/wardline-taint-fact-wire.golden.json"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: migration retirement guard
        run: |
          python scripts/check-migration-retirement.py --self-test
          python scripts/check-migration-retirement.py

      - name: cross-workspace version lockstep
        run: python scripts/check-workspace-version-lockstep.py

      - name: pyright pin lockstep
        run: |
          python scripts/check-pyright-pin-lockstep.py --self-test
          python scripts/check-pyright-pin-lockstep.py

      - name: wardline version bounds
        run: |
          python scripts/check-wardline-version-bounds.py --self-test
          python scripts/check-wardline-version-bounds.py

      - name: entity-cap ADR/code lockstep
        run: |
          python scripts/check-entity-cap-lockstep.py --self-test
          python scripts/check-entity-cap-lockstep.py

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Trust-surface — loomweave-core must not link an HTTP client
        # PRD-0001 / clarion-141e9c08c8: the plugin-supervisor + SEI crate must
        # not carry an outbound HTTP client; provider HTTP lives in loomweave-llm.
        # `--prefix none` flattens the tree so the anchor matches an indented dep
        # (a plain `^reqwest` against the tree output never matches and would pass
        # vacuously). `reqwest` stays legitimate in federation/cli — this is a
        # per-crate ban cargo-deny's [bans] cannot express.
        run: |
          set -euo pipefail
          # Capture first so a `cargo tree` failure exits the step (under `set -e`)
          # instead of being swallowed by the pipe and read as "no reqwest".
          deps="$(cargo tree -p loomweave-core --edges normal --prefix none)"
          if grep -qE '^reqwest v' <<<"$deps"; then
            echo "::error::loomweave-core links reqwest; the provider HTTP must stay in loomweave-llm (PRD-0001)"
            exit 1
          fi
          echo "OK: loomweave-core has no reqwest in its dependency tree"

      - name: install cargo-nextest
        uses: taiki-e/install-action@e310bff3ef77234d477d6bb655da153a5c49d1db

      # Ensure all workspace binaries (notably loomweave-plugin-fixture) are built
      # before nextest runs. wp2_e2e tests need the fixture binary on disk and
      # nextest's CARGO_BIN_EXE_* propagation is not reliably set for cross-package
      # dev-dep binaries (deferred issue clarion-adeff0916d).
      - name: build workspace bins
        run: cargo build --workspace --bins

      - name: test
        run: cargo nextest run --workspace --all-features --no-tests=pass

      # Task 2 (confined worktree-index deletion primitive): the bind-mount
      # confinement test needs an unprivileged user+mount namespace
      # (unshare(CLONE_NEWUSER|CLONE_NEWNS)), available to unprivileged
      # processes on ubuntu-latest but not universally, so it's #[ignore]d
      # everywhere else and run explicitly, here, as its own step. See
      # crates/loomweave-cli/tests/worktree_confine.rs's doc comment on
      # `bind_mount_beneath_candidate_refuses_deletion` for why the
      # namespace setup itself runs in a separate, freshly-spawned
      # loomweave-worktree-confine-probe binary rather than in this test
      # process. The preceding "build workspace bins" + "test" steps already
      # rebuild that probe fresh, so this step (unlike a standalone local
      # run) is not exposed to the stale-dev-dep-binary footgun documented
      # there.
      #
      # Deliberately NOT `--no-tests=pass` (unlike the "test" step above):
      # this step exists to run exactly one test, so if a future rename or
      # `#[cfg]` change ever makes the `-E 'test(bind_mount)'` filter match
      # zero tests, the step must error, not pass vacuously. Do not add
      # `--no-tests=pass` here to "fix" a red run — that would silently
      # disable this gate instead of running it.
      #
      # Ubuntu 24.04 (current ubuntu-latest) restricts unprivileged user
      # namespaces via AppArmor by default (`kernel.apparmor_restrict_
      # unprivileged_userns=1`); lift it first (ubuntu-latest has
      # passwordless sudo) so `unshare(CLONE_NEWUSER)` can actually succeed.
      # Do NOT remove this thinking it's stray/unexplained sudo — without
      # it, the suite below fails loud with a capability diagnostic instead
      # of testing confinement. The suite itself stays fail-loud exactly as
      # designed: this only grants the *capability* to acquire a namespace,
      # it doesn't touch how the test asserts once it has one.
      - name: allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: confined-deletion privileged suite
        run: cargo nextest run -p loomweave-cli --run-ignored ignored-only -E 'test(bind_mount)'

      - name: doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: install cargo-deny
        uses: taiki-e/install-action@2e721ffcfc34740897fc3130e2dd782b1c136896

      - name: deny
        run: cargo deny check

  # macOS build + lint parity. The release matrix was the first place macOS was
  # ever compiled, so a macOS-only `-D warnings` regression stayed invisible
  # until tag-cut (clarion-12667da9f5). This native runner job closes that gap.
  # It mirrors only the Linux job's clippy + bin build — the Python guards are
  # platform-independent and already covered by the `rust` job. No `--target`
  # flag: native builds avoid the ring C-build-script failure seen when
  # cross-compiling Linux -> macOS.
  #
  # Only aarch64-apple-darwin (macos-14) runs here: the x86_64 (macos-13) leg is
  # temporarily dropped while those runners are offline/unreliable. Restore it
  # when macos-13 runner health recovers (clarion-12667da9f5 follow-up). The
  # unused-symbol class this gate guards is `target_os = "macos"`, i.e.
  # arch-independent, so aarch64 coverage catches the same regressions.
  rust-macos:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: ${{ matrix.target }}

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build workspace bins
        run: cargo build --workspace --bins

  python-plugin:
    name: Python plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: plugins/python/uv.lock

      - name: cache pyright runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pyright-python/
          key: pyright-python-1.1.409-${{ runner.os }}

      - name: check Python ontology version lockstep
        run: |
          python scripts/check-python-ontology-version.py --self-test
          python scripts/check-python-ontology-version.py

      - name: install uv
        run: python -m pip install uv==0.10.2

      - name: sync plugin (locked dev extras)
        run: uv sync --project plugins/python --locked --extra dev

      - name: audit locked Python dependencies
        run: |
          uv export --project plugins/python --locked --extra dev --no-emit-project \
            --format requirements.txt \
            --output-file /tmp/loomweave-python-dev-requirements.txt
          uv run --project plugins/python --extra dev pip-audit \
            -r /tmp/loomweave-python-dev-requirements.txt

      - name: check B.4*/B.5 performance gates
        run: uv run --project plugins/python --extra dev python scripts/check-b4-gate-result.py --run-b5-smoke

      - name: ruff check
        run: uv run --project plugins/python --extra dev ruff check plugins/python scripts

      - name: ruff format check
        run: uv run --project plugins/python --extra dev ruff format --check plugins/python

      - name: mypy
        run: uv run --project plugins/python --extra dev mypy --strict plugins/python

      - name: pytest
        run: uv run --project plugins/python --extra dev pytest plugins/python

  # A second interpreter leg (clarion-09181ad2d5): the plugin's floor is 3.11,
  # but the PEP 695 type-parameter tests are `sys.version_info < (3, 12)`
  # skips — on a 3.11-only matrix they never execute anywhere, so the
  # type-parameter names path in pyright_session.py had zero CI coverage.
  # Deliberately a separate job (not a matrix on `python-plugin`): renaming
  # that job would break any branch-protection rule pinned to its check name.
  # Only the version-sensitive steps run here; lint/type/audit gates stay
  # single-legged on 3.11.
  python-plugin-312:
    name: Python plugin (3.12 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/python/uv.lock

      - name: cache pyright runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pyright-python/
          key: pyright-python-1.1.409-${{ runner.os }}-py312

      - name: install uv
        run: python -m pip install uv==0.10.2

      - name: sync plugin (locked dev extras)
        run: uv sync --project plugins/python --locked --extra dev

      - name: pytest
        run: uv run --project plugins/python --extra dev pytest plugins/python

      # The whole reason this leg exists: fail loud if the PEP 695 tests were
      # skipped anyway (e.g. uv resolved a different interpreter), instead of
      # silently reporting green with the coverage gap intact.
      - name: assert PEP 695 tests ran
        run: |
          set -o pipefail
          uv run --project plugins/python --extra dev pytest plugins/python \
            --no-cov -k "type_parameter or type_alias_after_definition" -rs \
            --no-header | tee /tmp/pep695.out
          if grep -qi "skipped" /tmp/pep695.out; then
            echo "PEP 695 tests were skipped on the 3.12 leg" >&2
            exit 1
          fi

  walking-skeleton:
    name: Sprint 1 walking skeleton (end-to-end)
    runs-on: ubuntu-latest
    needs: [rust, python-plugin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: plugins/python/pyproject.toml

      - name: cache pyright runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pyright-python/
          key: pyright-python-1.1.409-${{ runner.os }}

      - name: install sqlite3 cli
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3

      - name: run walking skeleton
        run: bash tests/e2e/sprint_1_walking_skeleton.sh

      - name: run WP5 secret scanner smoke
        run: CARGO_BUILD=0 bash tests/e2e/wp5_secret_scan.sh

      - name: Sprint 2 MCP surface
        run: CARGO_BUILD=0 bash tests/e2e/sprint_2_mcp_surface.sh

      - name: Phase 3 subsystems
        run: CARGO_BUILD=0 bash tests/e2e/phase3_subsystems.sh

      # The federation seam fixtures are normative for consumers (Plainweave
      # pins these bytes per docs/federation/2026-07-12-federation-seam-golden-
      # authority.md), but nothing regenerated them from the real producer, so
      # a routine version bump staleness them with every other guard green —
      # bytes, .sha256 sidecars and authority-note rows all derive from the
      # same committed file and agree with each other while disagreeing with
      # what analyze now emits. This job is the only one with both the built
      # binaries and the Python plugin, so the loop closes here. Mirrors the
      # Wardline taint golden step in the `rust` job (clarion-72e1c1a07d).
      - name: federation seam golden lockstep
        run: |
          python -m pip install uv==0.10.2
          bash scripts/generate-federation-seam-goldens.sh
          bash scripts/check-federation-seam-goldens-hermetic.sh
