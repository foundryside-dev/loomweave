[package]
name = "loomweave-cli"
description = "Loomweave: a code-archaeology tool that analyzes a codebase into a queryable entity/edge graph and serves it over MCP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "loomweave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
clap.workspace = true
loomweave-core = { path = "../loomweave-core", version = "1.5.0" }
loomweave-llm = { path = "../loomweave-llm", version = "1.5.0" }
loomweave-analysis = { path = "../loomweave-analysis", version = "1.5.0" }
loomweave-federation = { path = "../loomweave-federation", version = "1.5.0" }
loomweave-mcp = { path = "../loomweave-mcp", version = "1.5.0" }
loomweave-scanner = { path = "../loomweave-scanner", version = "1.5.0" }
loomweave-storage = { path = "../loomweave-storage", version = "1.5.0" }
dotenvy.workspace = true
fs2.workspace = true
hmac.workspace = true
ignore.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# unix-only: the confined-deletion primitive's fd pinning (worktree/confine.rs)
# — rustix has no fs/fd surface on Windows, where deletion refuses
# UnsupportedPlatform without ever touching an fd (clarion-4cd5b0b3b9).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }
# serve's SIGINT/SIGTERM latch (clarion-7ad374bac4): without it those signals
# kill the process before `PublishedPortGuard` can compare-and-delete the
# published ephemeral.port marker.
signal-hook.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# Path-only (no version): loomweave-plugin-fixture is publish=false (test-only),
# so the version pin is omitted — cargo strips path-only dev-deps when packaging
# `loomweave` for crates.io, which would otherwise fail on the unpublished crate.
loomweave-plugin-fixture = { path = "../loomweave-plugin-fixture" }
rusqlite.workspace = true
serde_json.workspace = true
sha1.workspace = true
tempfile.workspace = true

# Targeted `kill(pid, SIGTERM/SIGINT)` in tests/serve.rs — pid-addressed,
# never the process group (which would take the test runner down with it).
[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal"] }

# Path-only (no version): publish=false and test-only, same rationale as
# loomweave-plugin-fixture above. Spawned by the privileged bind-mount test in
# tests/worktree_confine.rs — see its crate docs for why the namespace setup
# has to run in a freshly-started binary rather than in-process. Linux-only:
# the probe drives unshare/bind-mount syscalls that exist nowhere else, and
# its rustix mount/thread features do not build on non-Linux targets.
[target.'cfg(target_os = "linux")'.dev-dependencies]
loomweave-worktree-confine-probe = { path = "../loomweave-worktree-confine-probe" }
